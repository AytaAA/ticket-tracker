server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Security review 2026-11-24: no framing (clickjacking), no MIME sniffing, no Referer (keeps /verify?token= private)
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;  # keeps the port, used by the backend's Origin check
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: unknown paths fall back to index.html so client routes survive a refresh
    location / {
        try_files $uri /index.html;
    }
}
